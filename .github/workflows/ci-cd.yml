name: CI / CD Pipeline


on:
  push:
    branches: [main, master, develop, server]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Ручной запуск


jobs:
  test:
    runs-on: ubuntu-latest


    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379


    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'test-secret-key' }}
      DEBUG: "True"
      DATABASE_URL: sqlite:///db.sqlite3
      REDIS_URL: redis://localhost:6379/0
      STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY || 'pk_test_dummy' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy' }}
      BASE_URL: http://localhost:8000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      CELERY_BROKER_URL: redis://localhost:6379/0


    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'


      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev
 

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov django-coverage
 

      - name: Check code formatting
        run: |
          pip install black isort
          black --check .
          isort --check-only --profile black .
 

      - name: Run migrations and create test database
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py create_test_data
 

      - name: Run Django tests
        run: |
          python manage.py test --parallel=4
 

      - name: Run API tests with pytest
        run: |
          pytest --ds=config.settings --cov=./ --cov-report=xml --cov-report=html -v
 

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: success()
        with:
          file: ./coverage.xml
          fail_ci_if_error: false


      - name: Security check with bandit
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
 

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            bandit-report.json
            htmlcov/
 

  build-docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/server')


    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build Docker image
        run: |
          docker build -t lms-app:latest .
 

      - name: Save Docker image as artifact
        run: |
          docker save lms-app:latest -o lms-app.tar
          gzip lms-app.tar
 

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: lms-app.tar.gz


  deploy:
    needs: [test, build-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/server')


    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image


      - name: Deploy to production server
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
 
 
            echo "=== Начало деплоя ==="
            echo "Время: $(date)"
 
 
            # Создание директории для деплоя
            DEPLOY_DIR="/home/django/deployments/$(date +%Y%m%d_%H%M%S)"
            mkdir -p $DEPLOY_DIR
 
 
            # Копирование образа на сервер
            echo "Копирование Docker образа..."
 
 
            # Вариант 1: Без Docker (традиционный деплой)
            echo "Вариант 1: Традиционный деплой"
 
 
            cd /home/django/lms-project
 
 
            # Обновление кода
            git pull origin main
 
 
            # Активация виртуального окружения
            source venv/bin/activate
 
 
            # Обновление зависимостей
            pip install -r requirements.txt
 
 
            # Применение миграций
            python manage.py migrate
 
 
            # Сборка статики
            python manage.py collectstatic --noinput
 
 
            # Запуск проверок
            python manage.py check --deploy
 
 
            # Перезапуск Gunicorn
            sudo systemctl restart gunicorn
 
 
            # Перезапуск Celery
            sudo systemctl restart celery
            sudo systemctl restart celery-beat
 
 
            echo "=== Деплой завершен успешно ==="
 
 
            # Проверка статуса сервисов
            echo "Проверка статуса сервисов:"
            sudo systemctl status gunicorn --no-pager
            sudo systemctl status celery --no-pager
            sudo systemctl status celery-beat --no-pager
 
 
            # Проверка доступности приложения
            sleep 5
            curl -f http://localhost:8000/api/health/ || echo "Health check failed, but continuing..."